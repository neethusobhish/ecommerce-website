{% extends 'base.html' %}


{% block content%}


<!-- Products -->
    <div class="allpro"> 
        <a href="{% url 'addproduct' %}"><button> Add product</button></a>
    </div>

    <section class="products" id="products">
        <h2>All Products</h2>

        <div class="product-list">
            {% for i in pro %}
            <div class="product-card">
                <img src="{{i.image}}" alt="image">
                <a href="{% url 'prodetails' i.id %}"><h3>{{i.name}}</h3></a>
                <p class="price">{{i.price}}</p>
                <a href="{% url 'add_to_cart' i.id %}"><button>Add to Cart</button></a>
            </div>
            {% endfor %}
            
        </div>
    </section>

{% endblock %}
