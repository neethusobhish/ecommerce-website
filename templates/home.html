{% extends 'base.html' %}


{% block content%}

<!-- Hero Section -->
<section class="hero">
    <div>
        <h1>Discover Your Style</h1>
        <p>Shop the latest products at amazing prices.</p>
        <button onclick="scrollProducts()">Shop Now</button>
    </div>
</section>

<!-- Categories -->
<section class="categories" id="categories">
    <h2>Shop By Category</h2>

    <div class="category-list">
        <div class="category">👗<p>Fashion</p></div>
        <div class="category">📱<p>Electronics</p></div>
        <div class="category">⌚<p>Accessories</p></div>
        <div class="category">🏠<p>Home</p></div>
    </div>
</section>

<!-- Products -->
<section class="products" id="products">
    <h2>Featured Products</h2>

    <div class="product-list">

        <div class="product-card">
            <img src="https://placehold.co/300x250?text=Shoes" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p class="price">₹1,499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x250?text=Watch" alt="Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹2,499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x250?text=Bag" alt="Bag">
            <h3>Hand Bag</h3>
            <p class="price">₹999</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x250?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹1,799</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </div>
</section>

{% endblock %}
